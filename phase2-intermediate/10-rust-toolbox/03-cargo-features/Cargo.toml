[package]
name = "p2-10-03-cargo-features"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# No features on by default — the base crate compiles with zero dependencies.
default = []
# Turning this on pulls in the two optional deps below and unlocks `to_json`.
json-export = ["dep:serde", "dep:serde_json"]
# Gates examples/02, which is deliberately broken — see docs/lesson-standard.md §5.
broken = []

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[[example]]
name = "02-to-json-without-feature"
required-features = ["broken"]
