[package]
name = "p2-10-04-unsafe-for-real"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `03`-`05` do not compile. Each sits behind a feature so running it is a
# deliberate act and the workspace stays green by default — see
# docs/lesson-standard.md §5.
[features]
broken = []

[[example]]
name = "03-split-at-mut-naive-broken"
required-features = ["broken"]

[[example]]
name = "04-deref-outside-unsafe-broken"
required-features = ["broken"]

[[example]]
name = "05-raw-pointer-not-send-broken"
required-features = ["broken"]
