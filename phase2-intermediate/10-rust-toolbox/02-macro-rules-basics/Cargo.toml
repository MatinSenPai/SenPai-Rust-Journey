[package]
name = "p2-10-02-macro-rules-basics"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `04` and `05` do not behave like the rest: both fail to compile. They sit
# behind a feature so running them is a deliberate act and the workspace
# stays green by default.
[features]
broken = []

[[example]]
name = "04-wrong-fragment-specifier-broken"
required-features = ["broken"]

[[example]]
name = "05-missing-base-case-broken"
required-features = ["broken"]
