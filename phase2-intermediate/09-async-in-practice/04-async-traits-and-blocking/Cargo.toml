[package]
name = "p2-09-04-async-traits-and-blocking"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true

# `05`, `06` and `07` fail to compile. All three sit behind a feature so
# running them is a deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "05-dyn-native-async-trait-broken"
required-features = ["broken"]

[[example]]
name = "06-forgot-async-trait-on-impl-broken"
required-features = ["broken"]

[[example]]
name = "07-spawn-blocking-forgot-move-broken"
required-features = ["broken"]
