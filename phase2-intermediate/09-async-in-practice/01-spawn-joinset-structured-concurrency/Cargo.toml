[package]
name = "p2-09-01-spawn-joinset-structured-concurrency"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true

# `07` fails to compile; `08` compiles but panics. Both sit behind a feature
# so running them is a deliberate act and the workspace stays green by
# default.
[features]
broken = []

[[example]]
name = "07-forgot-await-on-join-next"
required-features = ["broken"]

[[example]]
name = "08-unwrap-panicked-join"
required-features = ["broken"]
