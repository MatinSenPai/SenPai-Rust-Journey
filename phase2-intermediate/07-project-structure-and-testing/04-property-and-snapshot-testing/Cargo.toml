[package]
name = "p2-07-04-property-and-snapshot-testing"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dev-dependencies]
proptest = "1"
insta = "1"

# `03` and `04` are deliberately broken — `03` fails a genuine proptest
# property (a shrunk counterexample), `04`'s committed snapshot predates a
# wording change in the code. Both sit behind a feature so running them is a
# deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "03-broken-sign-drop"
required-features = ["broken"]

[[example]]
name = "04-broken-stale-snapshot"
required-features = ["broken"]
