[package]
name = "p2-08-06-tokio-basics"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true

# `05` and `06` fail to compile; `07` compiles but panics. All three sit
# behind a feature so running them is a deliberate act and the workspace
# stays green by default.
[features]
broken = []

[[example]]
name = "05-forgot-tokio-main"
required-features = ["broken"]

[[example]]
name = "06-await-outside-async"
required-features = ["broken"]

[[example]]
name = "07-spawn-without-runtime"
required-features = ["broken"]
