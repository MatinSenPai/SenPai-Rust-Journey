[package]
name = "p2-08-01-threads-mutex-arc"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `05`-`08` do not behave like the rest: `05`, `06`, and `07` fail to
# compile, `08` compiles but panics. They sit behind a feature so running
# them is a deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "05-borrow-without-move-broken"
required-features = ["broken"]

[[example]]
name = "06-mutex-without-arc-broken"
required-features = ["broken"]

[[example]]
name = "07-bare-tail-guard-broken"
required-features = ["broken"]

[[example]]
name = "08-unwrap-poisoned-lock-broken"
required-features = ["broken"]
