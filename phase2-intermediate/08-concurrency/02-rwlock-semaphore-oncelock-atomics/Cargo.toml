[package]
name = "p2-08-02-rwlock-semaphore-oncelock-atomics"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `09`-`12` do not behave like the rest: `09`, `10` and `12` fail to compile,
# `11` compiles but panics. They sit behind a feature so running them is a
# deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "09-rwlock-move-without-arc"
required-features = ["broken"]

[[example]]
name = "10-write-through-read-guard"
required-features = ["broken"]

[[example]]
name = "11-oncelock-set-twice-panics"
required-features = ["broken"]

[[example]]
name = "12-atomics-no-direct-equality"
required-features = ["broken"]
