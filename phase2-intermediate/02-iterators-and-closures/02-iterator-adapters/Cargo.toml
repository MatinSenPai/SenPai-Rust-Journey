[package]
name = "p2-02-02-iterator-adapters"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `10` and `11` do not compile — that is the point, see `## Errors you will
# meet`. They sit behind a feature so running them is a deliberate act and
# the workspace stays green by default.
[features]
broken = []

[[example]]
name = "10-next-needs-mut"
required-features = ["broken"]

[[example]]
name = "11-rev-needs-double-ended"
required-features = ["broken"]
