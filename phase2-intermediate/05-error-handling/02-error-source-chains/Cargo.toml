[package]
name = "p2-05-02-error-source-chains"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# 05-07 do not compile. Each sits behind a feature so running it is a
# deliberate act and the workspace stays green by default — see
# docs/lesson-standard.md §5.
[features]
broken = []

[[example]]
name = "05-source-wrong-lifetime-broken"
