[package]
name = "p2-05-04-error-taxonomy-for-a-service"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
anyhow.workspace = true

# `06` and `07` do not compile — each is a taxonomy-design mistake caught at
# compile time. They sit behind a feature so running them is a deliberate
# act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "06-non-exhaustive-after-new-category"
required-features = ["broken"]

[[example]]
name = "07-question-mark-needs-a-category"
required-features = ["broken"]
