[package]
name = "p2-03-03-from-into-tryfrom"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `07`-`09` do not behave like the rest: `07` and `09` fail to compile, `08`
# compiles but panics. They sit behind a feature so running them is a
# deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "07-result-not-a-value"
required-features = ["broken"]

[[example]]
name = "08-narrow-panics-on-overflow"
required-features = ["broken"]

[[example]]
name = "09-missing-error-type"
required-features = ["broken"]
