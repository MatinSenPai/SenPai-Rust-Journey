[package]
name = "p2-03-02-generic-functions-and-structs"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `04`-`06` do not behave like the rest: all three fail to compile on purpose.
# They sit behind a feature so running them is a deliberate act and the
# workspace stays green by default.
[features]
broken = []

[[example]]
name = "04-missing-bound"
required-features = ["broken"]

[[example]]
name = "05-impl-block-bound"
required-features = ["broken"]

[[example]]
name = "06-missing-one-of-two-bounds"
required-features = ["broken"]
