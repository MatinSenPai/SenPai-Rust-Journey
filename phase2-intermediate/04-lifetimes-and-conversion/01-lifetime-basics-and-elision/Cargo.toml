[package]
name = "p2-04-01-lifetime-basics-and-elision"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `05` and `06` do not behave like the rest: both fail to compile on purpose.
# They sit behind a feature so running them is a deliberate act and the
# workspace stays green by default.
[features]
broken = []

[[example]]
name = "05-two-inputs-one-output"
required-features = ["broken"]

[[example]]
name = "06-shorter-input-does-not-live-long-enough"
required-features = ["broken"]
