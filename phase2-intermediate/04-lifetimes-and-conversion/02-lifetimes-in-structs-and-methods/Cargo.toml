[package]
name = "p2-04-02-lifetimes-in-structs-and-methods"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `02` and `03` do not compile: `02` is missing the struct's own lifetime
# parameter, `03` builds an `Excerpt` that outlives the data it borrows. They
# sit behind a feature so running them is a deliberate act and the workspace
# stays green by default.
[features]
broken = []

[[example]]
name = "02-struct-without-lifetime"
required-features = ["broken"]

[[example]]
name = "03-excerpt-outlives-its-source"
required-features = ["broken"]
