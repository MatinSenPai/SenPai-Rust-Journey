[package]
name = "p2-01-04-choosing-a-collection"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `06`-`08` do not compile — each is a wrong-collection mistake caught at
# compile time. They sit behind a feature so running them is a deliberate
# act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "06-hashmap-is-not-positional"
required-features = ["broken"]

[[example]]
name = "07-hashmap-has-no-sort"
required-features = ["broken"]

[[example]]
name = "08-binaryheap-has-no-remove"
required-features = ["broken"]
