[package]
name = "p2-01-03-btreemap-hashset-vecdeque"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `06`-`09` do not behave like the rest: `06` compiles but panics, `07`-`09`
# fail to compile. They sit behind a feature so running (or building) them is
# a deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "06-btreemap-range-start-after-end"
required-features = ["broken"]

[[example]]
name = "07-hashset-no-indexing"
required-features = ["broken"]

[[example]]
name = "08-vec-has-no-pop-front"
required-features = ["broken"]

[[example]]
name = "09-binaryheap-needs-ord"
required-features = ["broken"]
