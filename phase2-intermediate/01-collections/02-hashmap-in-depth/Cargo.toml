[package]
name = "p2-01-02-hashmap-in-depth"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `07`-`09` do not compile (07 fails to typecheck, 08 fails a trait bound, 09
# fails the borrow checker). They sit behind a feature so running them is a
# deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "07-forgot-deref-on-entry"
required-features = ["broken"]

[[example]]
name = "08-key-missing-hash-eq"
required-features = ["broken"]

[[example]]
name = "09-double-borrow-get-then-insert"
required-features = ["broken"]
