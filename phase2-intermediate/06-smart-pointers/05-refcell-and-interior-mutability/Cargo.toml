[package]
name = "p2-06-05-refcell-and-interior-mutability"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `05`-`07` do not behave like the rest: `05` and `06` fail to compile, `07`
# compiles but panics. They sit behind a feature so running them is a
# deliberate act and the workspace stays green by default.
[features]
broken = []

[[example]]
name = "05-mutate-through-shared-self"
required-features = ["broken"]

[[example]]
name = "06-cell-get-requires-copy"
required-features = ["broken"]

[[example]]
name = "07-double-borrow-mut-panics"
required-features = ["broken"]
