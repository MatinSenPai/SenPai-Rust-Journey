[package]
name = "p2-06-03-rc-and-arc"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `05`-`07` do not compile. Each sits behind a feature so running it is a
# deliberate act and the workspace stays green by default — see
# docs/lesson-standard.md §5.
[features]
broken = []

[[example]]
name = "05-forgot-to-clone-broken"
required-features = ["broken"]

[[example]]
name = "06-cannot-mutate-through-rc-broken"
required-features = ["broken"]

[[example]]
name = "07-rc-arc-mismatch-broken"
required-features = ["broken"]
