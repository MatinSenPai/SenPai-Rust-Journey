# The concept map
#
# Every concept the curriculum teaches, and exactly where it is introduced,
# deepened, and mastered. `cargo run -p lesson-lint` reads this file and fails
# when a lesson's code or prose uses a concept that a later lesson introduces.
#
# This is the mechanism that prevents the defect the old curriculum had:
# `Vec<String>` appearing in a Phase 1 ownership exercise while `Vec` was
# taught in Phase 2.
#
# Fields
# ------
#   id             stable slug, referenced by the web UI's mastery grid
#   fa / en        display names
#   introduced_in  the lesson that first teaches it (repo-relative path)
#   deepened_in    lessons that legitimately extend it
#   previewed_in   lessons allowed to USE it before it is taught, without
#                  claiming to teach it. Phase 0 shows a working program that
#                  contains `String` and `&str`; the mastery grid must not
#                  light those up, and the lint must not forbid them.
#   mastered_in    the lesson after which it is assumed known (optional)
#   detect         substrings that, found in Rust code, mean "this is in use".
#                  Keep these unambiguous — a false positive is worse than a
#                  missed detection, because it trains you to ignore the lint.
#   prose_only     true for concepts with no code signature (stack vs heap).
#                  Ordering is then the author's responsibility, and the entry
#                  exists so the mastery grid can show it.
#
# A concept whose `introduced_in` lesson does not exist yet is reported as
# PENDING and skipped, so this file can be seeded ahead of the content that
# fills it in. See docs/lesson-standard.md §8.

# ---------------------------------------------------------------------------
# Always available — taught at a surface level in Phase 0 so that every later
# lesson may use them, then taught properly where `deepened_in` says.
# ---------------------------------------------------------------------------

