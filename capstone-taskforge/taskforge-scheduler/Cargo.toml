[package]
name = "taskforge-scheduler"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
taskforge-core = { path = "../taskforge-core" }
# The Scheduler itself only depends on the `JobStore` trait. This is here
# for (a) the service binary, src/main.rs, which constructs the real
# `PostgresJobStore`, and (b) this crate's tests (`InMemoryJobStore`).
taskforge-storage = { path = "../taskforge-storage" }
tokio.workspace = true
tracing.workspace = true
# Only the binary (src/main.rs) initializes a subscriber.
tracing-subscriber.workspace = true
