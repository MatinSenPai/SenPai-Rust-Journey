[workspace]
resolver = "2"
members = [
    # Tooling, not curriculum: the local web UI for reading the repo. An
    # explicit path, not a glob — see the glob rule documented below.
    "web-ui",
    # Tooling, not curriculum: enforces docs/lesson-standard.md.
    "tools/lesson-lint",
    "phase0-setup/03-hello-rust",
    "phase0-setup/04-cargo-basics",
    "phase0-setup/05-reading-compiler-errors",
    "phase0-setup/06-tooling-clippy-fmt-rust-analyzer",
    "phase1-fundamentals/*/*",
    "phase2-intermediate/*/*",
    "phase3-backend-foundations/*/*",
    "phase4-backend-advanced/*/*",
    "side-quests/sq-*",
    "capstone-taskforge/taskforge-*",
    "phase5-system-design-mastery/07-applied-system-design/01-design-a-url-shortener",
    "phase5-system-design-mastery/07-applied-system-design/02-design-a-distributed-rate-limiter",
    "phase5-system-design-mastery/07-applied-system-design/03-design-a-chat-system",
    "phase5-system-design-mastery/07-applied-system-design/04-design-a-notification-system",
]

# Doc-only lessons (no Cargo.toml) would otherwise be matched by the phase3/phase4 globs
# above and break `cargo build --workspace` (every matched directory must have a Cargo.toml)
# — excluded explicitly instead:
exclude = [
    "phase4-backend-advanced/03-background-jobs-and-message-queues/02-broker-concepts-rabbitmq-kafka-nats",
    "phase4-backend-advanced/06-system-design-fundamentals/01-cap-scaling-lb-idempotency-locking",
]

# Other doc-only lessons (no Cargo.toml) that simply aren't reached by any glob at all:
# phase0-setup/{01-what-is-a-compiled-language,02-installing-rust-and-toolchains,
#               07-git-and-repo-workflow}
# `solution/` crates live one directory deeper than each lesson glob reaches, so they are
# never picked up as workspace members automatically — build/test them explicitly by path.
#
# IMPORTANT (confirmed empirically against cargo 1.94.1): a glob member pattern that matches
# ZERO directories is a hard error ("failed to read .../Cargo.toml"), not a silent no-op. So
# phase2-intermediate/*/*, phase3-backend-foundations/*/*, phase4-backend-advanced/*/*,
# side-quests/sq-*, and capstone-taskforge/taskforge-* are added to this list only once at
# least one real lesson/crate exists under each — see docs/conventions.md.

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
async-trait = "0.1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
teloxide = { version = "0.13", features = ["macros"] }
redis = { version = "0.27", features = ["tokio-comp"] }
tonic = "0.12"
prost = "0.13"
async-graphql = "7"
async-graphql-axum = "7"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9"
validator = { version = "0.18", features = ["derive"] }
utoipa = "5"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
criterion = "0.5"
rand = "0.8"
serial_test = "3"

[profile.dev]
# Keep incremental rebuilds fast across ~90 tiny lesson crates.
incremental = true
