[package]
name = "p1-03-04-slices"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `05`, `06` and `07` do not compile, and `08` compiles and then panics. All
# four are the subject of "Errors you will meet", so they sit behind a
# feature: running one is a deliberate act, and the repository stays green.
[features]
broken = []

[[example]]
name = "05-vec-parameter"
required-features = ["broken"]

[[example]]
name = "06-forgot-the-ampersand"
required-features = ["broken"]

[[example]]
name = "07-two-views-one-mutable"
required-features = ["broken"]

[[example]]
name = "08-off-the-end"
required-features = ["broken"]
