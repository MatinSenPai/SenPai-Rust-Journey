name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # Formatting is the one thing every file — skeleton or solution — must
      # satisfy. `cargo fmt --all` cannot deliver that: it only reaches
      # workspace members, and every lesson's `solution/` crate is its own
      # workspace, so it had never formatted a single one of them. (It also
      # dies on Windows now: ~100 packages puts its argument list past the
      # 32,767-byte command-line limit.) tools/check-fmt.sh formats every
      # tracked .rs file instead, in batches.
      - name: rustfmt --check (every tracked file)
        run: bash tools/check-fmt.sh
      # A lesson skeleton is INTENTIONALLY unfinished: its `todo!()` bodies
      # leave parameters unused and helpers uncalled, which `clippy -D warnings`
      # rightly flags — but those "warnings" are exactly the guidance the
      # learner works through (see docs/lesson-standard.md), not CI failures.
      # Linting the whole workspace with -D would make CI permanently red on an
      # untouched checkout. So we lint strictly only the code that ships
      # finished: the capstone (its service `main.rs` files are guarded
      # skeletons that stay clippy-clean) and `course-ui`, the web UI — tooling
      # rather than a lesson, so nothing in it is intentionally unfinished.
      - name: cargo clippy (finished code — must stay clean)
        run: >
          cargo clippy --all-targets
          -p taskforge-core -p taskforge-storage -p taskforge-worker
          -p taskforge-scheduler -p taskforge-api -p taskforge-admin-bot
          -p taskforge-cli -p course-ui -p lesson-lint
          -- -D warnings
      # Every skeleton must still COMPILE (unused-var warnings are fine; a type
      # error or bad API call is not). Compiling all test targets across the
      # workspace is what catches real breakage without running the
      # todo!()-panicking tests.
      - name: cargo test --no-run (all test targets compile)
        run: cargo test --workspace --no-run
      # Only finished code is expected green — lesson tests panic on `todo!()`
      # by design until a learner fills them in.
      - name: cargo test (finished code — must stay green)
        run: >
          cargo test
          -p taskforge-core -p taskforge-storage -p taskforge-worker
          -p taskforge-scheduler -p taskforge-api -p taskforge-admin-bot
          -p taskforge-cli -p course-ui -p lesson-lint
      # The curriculum standard, enforced. Lessons listed in
      # docs/lesson-lint-allow.txt are still being rebuilt
      # (plans/005-curriculum-rebuild.md) and only contribute to the deferred
      # count; everything else must meet docs/lesson-standard.md. The allowlist
      # only ever shrinks, so this gets stricter on its own.
      - name: lesson-lint (curriculum standard)
        run: cargo run -q -p lesson-lint
