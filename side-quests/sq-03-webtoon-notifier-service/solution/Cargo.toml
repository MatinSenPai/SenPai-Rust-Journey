[workspace]

[package]
name = "sq-03-webtoon-notifier-service-solution"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
