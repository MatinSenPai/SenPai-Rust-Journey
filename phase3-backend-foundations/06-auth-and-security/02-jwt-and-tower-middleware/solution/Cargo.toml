[workspace]

[package]
name = "p3-06-02-jwt-and-tower-middleware-solution"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
