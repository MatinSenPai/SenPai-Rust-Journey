[package]
name = "p3-08-05-websockets-and-sse-in-axum"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync", "time"] }

# `06` and `07` fail to compile, `08` panics. Each sits behind a feature so
# running it is a deliberate act and the workspace stays green by default — see
# docs/lesson-standard.md §5.
[features]
broken = []

[[example]]
name = "06-sse-item-not-result-broken"
required-features = ["broken"]

[[example]]
name = "07-ws-text-string-broken"
required-features = ["broken"]

[[example]]
name = "08-lagged-unwrap-panic-broken"
required-features = ["broken"]
