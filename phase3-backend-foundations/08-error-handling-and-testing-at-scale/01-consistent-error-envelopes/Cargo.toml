[package]
name = "p3-08-01-consistent-error-envelopes"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

# `02` and `03` fail to compile on purpose. They sit behind a feature so the
# workspace stays green by default (docs/lesson-standard.md §5).
[features]
broken = []

[[example]]
name = "02-missing-arm-broken"
required-features = ["broken"]

[[example]]
name = "03-question-mark-without-from-broken"
required-features = ["broken"]
