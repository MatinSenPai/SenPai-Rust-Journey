[workspace]

[package]
name = "p3-08-02-request-tracing-and-correlation-ids-solution"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
