[package]
name = "p3-03-03-api-contracts-and-openapi"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
utoipa.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

# `04`, `05` and `07` fail to compile. They sit behind a feature so the workspace
# stays green by default (docs/lesson-standard.md §5).
[features]
broken = []

[[example]]
name = "04-missing-to-schema-broken"
required-features = ["broken"]

[[example]]
name = "05-path-without-attribute-broken"
required-features = ["broken"]

[[example]]
name = "07-v4-content-syntax-broken"
required-features = ["broken"]
