[package]
name = "p3-03-04-api-versioning-and-evolution"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
validator.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

# `04` panics and `05` fails to compile. They sit behind a feature so the
# workspace stays green by default (docs/lesson-standard.md section 5).
[features]
broken = []

[[example]]
name = "04-renamed-field-breaks-client-broken"
required-features = ["broken"]

[[example]]
name = "05-new-enum-value-broken"
required-features = ["broken"]
