[package]
name = "p3-02-04-tower-service-and-layer-middleware"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
tower.workspace = true

[dev-dependencies]
tokio.workspace = true
tower = { workspace = true, features = ["util", "limit"] }

# `06` panics and `07`-`09` do not compile. Each sits behind a feature so
# running it is a deliberate act and the workspace stays green by default — see
# docs/lesson-standard.md §5.
[features]
broken = []

[[example]]
name = "06-clone-without-ready-broken"
required-features = ["broken"]

[[example]]
name = "07-future-not-send-broken"
required-features = ["broken"]

[[example]]
name = "08-service-not-clone-broken"
required-features = ["broken"]

[[example]]
name = "09-error-not-infallible-broken"
required-features = ["broken"]
