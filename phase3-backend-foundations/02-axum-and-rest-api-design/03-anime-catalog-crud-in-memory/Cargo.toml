[package]
name = "p3-02-03-anime-catalog-crud-in-memory"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

# `02` and `03` fail to compile. They sit behind a feature so the workspace
# stays green by default (docs/lesson-standard.md §5).
[features]
broken = []

[[example]]
name = "02-guard-across-await-broken"
required-features = ["broken"]

[[example]]
name = "03-error-without-into-response-broken"
required-features = ["broken"]

[[example]]
name = "04-guard-across-await-debug-handler-broken"
required-features = ["broken"]
