[package]
name = "p3-04-02-app-state-and-dependency-wiring"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["macros"] }
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }

# `04` to `07` fail to compile. They sit behind a feature so the
# workspace stays green by default (docs/lesson-standard.md section 5).
[features]
broken = []

[[example]]
name = "04-state-not-clone-broken"
required-features = ["broken"]

[[example]]
name = "05-dyn-without-send-sync-broken"
required-features = ["broken"]

[[example]]
name = "06-no-fromref-for-substate-broken"
required-features = ["broken"]

[[example]]
name = "07-two-fields-same-type-broken"
required-features = ["broken"]
