[package]
name = "p3-04-03-graceful-shutdown-health-readiness"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true

[dev-dependencies]
# `start_paused` for the timing test of `shutdown_future`.
tokio = { workspace = true, features = ["test-util"] }

# `04` and `05` fail to compile. They sit behind a feature so the workspace
# stays green by default (docs/lesson-standard.md §5).
[features]
broken = []

[[example]]
name = "04-fn-item-not-a-future-broken"
required-features = ["broken"]

[[example]]
name = "05-async-block-borrows-state-broken"
required-features = ["broken"]
