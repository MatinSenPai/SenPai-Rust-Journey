[workspace]

[package]
name = "p3-04-01-config-and-secrets-solution"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
