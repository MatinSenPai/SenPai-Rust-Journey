[package]
name = "p3-07-04-refresh-token-rotation-and-revocation"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
uuid.workspace = true

# `04` fails to compile, `05` panics. Both sit behind a feature so running
# them is a deliberate act and the workspace stays green by default — see
# docs/lesson-standard.md §5.
[features]
broken = []

[[example]]
name = "04-token-moved-broken"
required-features = ["broken"]

[[example]]
name = "05-unwrap-on-reuse-broken"
required-features = ["broken"]
